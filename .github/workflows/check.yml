name: check kits

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install LADO
        run: uv tool install "lado>=0.20"
      - name: Check the kits this change adds or changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=""
          fi
          uv run --no-project --with pyyaml python scripts/check_kits.py $base
      - name: Test the index builder
        run: uv run --no-project --with pyyaml --with pytest pytest -q tests
      - name: Build index.json without writing it
        run: uv run --no-project --with pyyaml python scripts/build_index.py --check
