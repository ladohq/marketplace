name: check kits

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install LADO
        run: uv tool install "lado>=0.20"
      - name: Check the kits this change adds or changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base=""
          fi
          uv run --no-project --with pyyaml python scripts/check_kits.py $base
      - name: Test the index builder
        run: uv run --no-project --with pyyaml --with pytest pytest -q tests
      - name: Build index.json without writing it
        run: uv run --no-project --with pyyaml python scripts/build_index.py --check
