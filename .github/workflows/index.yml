name: build index

on:
  push:
    branches: [main]
    paths:
      - marketplace.yaml
      - scripts/**
      - .github/workflows/index.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Install LADO
        run: uv tool install "lado>=0.20"
      - name: Build index.json
        id: build
        continue-on-error: true
        run: uv run --no-project --with pyyaml python scripts/build_index.py
      - name: Commit index.json if it changed
        run: |
          if git diff --quiet -- index.json && git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if a kit failed its check
        if: steps.build.outcome == 'failure'
        run: |
          echo "a kit failed its check: see the step Build index.json"
          exit 1
